server:
  port: 8081

spring:
  application:
    name: gen-ai-java-spring

  ai:
    openai:
      api-key: dummy-text #${OPENAI_API_KEY}
      base-url: http://localhost:12434/engines/llama.cpp/v1
      chat:
        model: ai/llama3.2 #gpt-6-luna

    ollama:
      base-url: http://localhost:11434
      chat:
        model: ministral-3:8b
        temperature: 0.7
        options:
          max-new-tokens: 512

logging:
  level:
    root: info
    org.example.genaijavaspring: INFO
    org.springframework.ai: INFO
